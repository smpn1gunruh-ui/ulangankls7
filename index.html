<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --purple:#46178f;--purple-d:#2d0e5f;--purple-l:#6d2fc7;
  --red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c;
  --bg:#f4f1fa;--surface:#ffffff;--text:#1f1637;--muted:#655e80;--line:#e2dcf0;
  --accent:#46178f;--accent-fg:#ffffff;--soft:#efe9fb;--ok:#1d7a06;--bad:#c4142f;
  --f-head:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#150d26;--surface:#20163a;--text:#efeaff;--muted:#a79fc4;--line:#372a5c;--accent:#a67bff;--accent-fg:#180c30;--soft:#2c1f4d;--ok:#5fd13a;--bad:#ff6b82}
}
:root[data-theme="dark"]{--bg:#150d26;--surface:#20163a;--text:#efeaff;--muted:#a79fc4;--line:#372a5c;--accent:#a67bff;--accent-fg:#180c30;--soft:#2c1f4d;--ok:#5fd13a;--bad:#ff6b82}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--text);background:var(--bg)}
body.stu{background:var(--purple);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #ffd43b;outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0}
.hide{display:none!important}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:8px;padding:.7rem 1.3rem;font-weight:800;font-size:1rem;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:.95rem 1.6rem;font-size:1.15rem;width:100%}
.btn-dark{background:#333;color:#fff}
.btn-white{background:#fff;color:var(--purple)}
.btn-green{background:var(--green);color:#fff}
.btn-yellow{background:#ffc00a;color:#3a2a00}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.lnk{background:none;border:0;color:#fff;text-decoration:underline;font-weight:700;padding:.5rem}

/* ---------- layar siswa ---------- */
.stu-wrap{min-height:100vh;min-height:100dvh;padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;align-items:center;gap:1rem;position:relative;overflow:hidden;
  background:
   radial-gradient(circle at 12% 18%,rgba(255,255,255,.07) 0 60px,transparent 61px),
   radial-gradient(circle at 88% 78%,rgba(255,255,255,.07) 0 90px,transparent 91px),
   var(--purple)}
.stu-wrap.center{justify-content:center}
.stu-wrap>*{position:relative;z-index:1;width:100%;max-width:440px}
.stu-wrap.wide>*{max-width:760px}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.15rem;text-align:center;opacity:.9}
.hero{font-size:clamp(2.6rem,10vw,4rem);text-align:center;font-weight:800;letter-spacing:-.01em}
.card{background:#fff;color:#1f1637;border-radius:10px;padding:1.25rem;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.login{display:flex;flex-direction:column;gap:.9rem}
.fld{display:flex;flex-direction:column;gap:.3rem;font-weight:700;font-size:.92rem}
.fld input,.fld select,.fld textarea{border:2px solid #cfc6e6;border-radius:8px;padding:.7rem .8rem;background:#fff;color:#1f1637;font-weight:600;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--purple-l);outline:none;box-shadow:0 0 0 3px rgba(109,47,199,.25)}
.err{margin:0;color:#c4142f;font-weight:700;min-height:1.2em;font-size:.92rem}
.hint{margin:0;text-align:center;font-size:.92rem;opacity:.9}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:760px!important}
.top-bar .who{font-family:var(--f-head);font-size:1.25rem;font-weight:700}
.data-grid{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin:.5rem 0 0}
.data-grid dt{color:#655e80;font-weight:700}
.data-grid dd{margin:0;font-weight:800}
.sec-title{font-size:1.5rem;margin-top:.5rem}
.exam-list{display:grid;gap:.9rem}
.ex-card{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;background:#fff;color:#1f1637;border-radius:10px;padding:1rem;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.ex-card .sh{width:48px;height:48px;border-radius:8px;display:grid;place-items:center}
.ex-card .sh svg{width:26px;height:26px;fill:#fff}
.ex-card h3{font-size:1.25rem}
.ex-card .meta{color:#655e80;font-size:.9rem;font-weight:600}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-weight:800;font-size:.8rem;background:#e9e2f7;color:#46178f}
.badge.ok{background:#d9f2cf;color:#1d6a05}
.badge.warn{background:#ffefb8;color:#7a5600}
.badge.bad{background:#ffd9df;color:#a5122a}
@media (max-width:520px){.ex-card{grid-template-columns:auto 1fr}.ex-card .act{grid-column:1/-1}.ex-card .act .btn{width:100%}}

/* ---------- ujian (gaya kuis) ---------- */
.exam{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--purple)}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1rem;background:var(--purple-d);position:sticky;top:0;z-index:5}
.ex-name{font-family:var(--f-head);font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-timer{font-family:var(--f-head);font-weight:800;font-size:1.4rem;background:#fff;color:var(--purple);border-radius:8px;padding:.1rem .8rem;min-width:5.5rem;text-align:center;font-variant-numeric:tabular-nums}
.ex-timer.low{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.prog{height:8px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:#ffc00a;transition:width .25s}
.ex-main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:1.2rem 1rem;display:flex;flex-direction:column;gap:1rem}
.qcount{font-weight:800;opacity:.9;text-align:center}
.qcard{background:#fff;color:#1f1637;border-radius:10px;padding:1.4rem 1.2rem;text-align:center;font-family:var(--f-head);font-weight:700;font-size:clamp(1.3rem,3.6vw,2rem);line-height:1.3;box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:9rem;display:flex;align-items:center;justify-content:center}
.qcard p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:1rem;border:0;border-radius:8px;min-height:96px;padding:.9rem 1.1rem;color:#fff;font-family:var(--f-head);font-weight:700;font-size:clamp(1.05rem,2.6vw,1.5rem);text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,opacity .15s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile .ico{flex:none;width:38px;height:38px}
.tile .ico svg{width:100%;height:100%;fill:#fff}
.tile .tx{overflow-wrap:anywhere;line-height:1.2}
.t-red{background:var(--red)}.t-blue{background:var(--blue)}.t-yellow{background:var(--yellow)}.t-green{background:var(--green)}
.tile.dim{opacity:.4}
.tile.sel{outline:5px solid #fff;outline-offset:-5px;transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.ex-foot{position:sticky;bottom:0;background:var(--purple-d);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.ex-foot .btn{min-width:8.5rem}
.navp{max-width:980px;width:100%;margin:0 auto;padding:0 1rem 1.2rem;color:#fff}
.navp summary{cursor:pointer;font-weight:800;padding:.5rem 0}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:.45rem;margin-top:.5rem}
.nb{border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;padding:.5rem 0;font-weight:800}
.nb.done{background:#fff;color:var(--purple);border-color:#fff}
.nb.flag{background:#ffc00a;color:#3a2a00;border-color:#ffc00a}
.nb.cur{outline:3px solid #ffd43b;outline-offset:2px}

/* hasil */
.score-ring{width:190px;height:190px;border-radius:50%;background:#fff;color:var(--purple);display:grid;place-items:center;margin:0 auto;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.score-ring b{font-family:var(--f-head);font-size:3.6rem;font-weight:800;line-height:1}
.score-ring small{display:block;text-align:center;font-weight:800;color:#655e80}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;text-align:center}
.stat3 div{border-radius:8px;padding:.7rem .3rem;color:#fff;font-weight:800}
.stat3 b{display:block;font-family:var(--f-head);font-size:1.8rem;line-height:1}

/* ---------- admin ---------- */
.adm-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--purple-d);color:#fff;padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.side .logo{font-family:var(--f-head);font-weight:800;font-size:1.3rem;padding:.2rem .6rem .8rem;line-height:1.15}
.side .logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:.8rem;opacity:.75}
.side button.nav{background:transparent;border:0;color:#e9defc;text-align:left;padding:.65rem .8rem;border-radius:8px;font-weight:700}
.side button.nav:hover{background:rgba(255,255,255,.1)}
.side button.nav.on{background:#fff;color:var(--purple)}
.side .out{margin-top:auto;background:rgba(255,255,255,.12);border:0;color:#fff;padding:.65rem;border-radius:8px;font-weight:700}
.content{padding:1.4rem 1.6rem 3rem;min-width:0}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.pg-head h2{font-size:1.9rem}
.pg-head p{margin:.2rem 0 0;color:var(--muted)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.bar .grow{flex:1;min-width:180px}
.a-in,.a-sel{border:2px solid var(--line);border-radius:8px;padding:.5rem .7rem;background:var(--surface);color:var(--text);min-height:42px}
.a-in:focus,.a-sel:focus{border-color:var(--accent);outline:none}
.ab{border:0;border-radius:8px;padding:.5rem .9rem;font-weight:800;min-height:42px;background:var(--accent);color:var(--accent-fg)}
.ab.sec{background:var(--soft);color:var(--accent)}
.ab.dng{background:var(--red);color:#fff}
.ab.sm{padding:.25rem .6rem;min-height:32px;font-size:.88rem}
.ab:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{border-radius:10px;padding:1rem;color:#fff}
.stat b{display:block;font-family:var(--f-head);font-size:2.2rem;line-height:1}
.stat span{font-weight:700;opacity:.95}
.stat.c1{background:var(--red)}.stat.c2{background:var(--blue)}.stat.c3{background:var(--yellow)}.stat.c4{background:var(--green)}.stat.c5{background:var(--purple-l)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--soft);color:var(--text);font-weight:800;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .row{display:flex;gap:.35rem;flex-wrap:wrap}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-weight:800;font-size:.8rem;background:var(--soft);color:var(--accent)}
.tag.ok{background:#d9f2cf;color:#1d6a05}.tag.bad{background:#ffd9df;color:#a5122a}.tag.warn{background:#ffefb8;color:#7a5600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.ok{background:#1d3b12;color:#8fe66d}:root:not([data-theme="light"]) .tag.bad{background:#4a1520;color:#ff9aab}:root:not([data-theme="light"]) .tag.warn{background:#4a3a0a;color:#ffd866}}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:.7rem}
.qitem .qt{font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:.5rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.6rem}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:.5rem;align-items:center;border-radius:8px;padding:.35rem .6rem;color:#fff;font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.opt.o0{background:var(--red)}.opt.o1{background:var(--blue)}.opt.o2{background:var(--yellow)}.opt.o3{background:var(--green)}
.opt.key{outline:3px solid var(--text);outline-offset:1px}
.opt svg{width:16px;height:16px;fill:#fff;flex:none}
.bargrp{display:flex;align-items:center;gap:.6rem}
.bg{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:80px}
.bg i{display:block;height:100%;background:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel h3{font-size:1.2rem;margin-bottom:.6rem}
.panel .fld{color:var(--text)}
.panel .fld input,.panel .fld select,.panel .fld textarea{background:var(--surface);color:var(--text);border-color:var(--line)}
.note{color:var(--muted);font-size:.9rem;margin:.4rem 0 0}

@media (max-width:820px){
  .adm-shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:.5rem;z-index:20;gap:.25rem;align-items:center}
  .side .logo{display:none}
  .side button.nav{white-space:nowrap}
  .side .out{margin:0 0 0 auto;white-space:nowrap}
  .content{padding:1rem .8rem 3rem}
}

/* ---------- modal & toast ---------- */
.ov{position:fixed;inset:0;background:rgba(15,6,32,.66);display:grid;place-items:center;padding:1rem;z-index:50;overflow:auto}
.mdl{background:var(--surface);color:var(--text);width:100%;max-width:560px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);max-height:calc(100dvh - 2rem);display:flex;flex-direction:column}
.mdl.wide{max-width:760px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.mh h3{font-size:1.3rem}
.mh .x{background:none;border:0;font-size:1.8rem;line-height:1;color:var(--muted);padding:0 .3rem}
.mb{padding:1.1rem 1.2rem;overflow:auto;display:flex;flex-direction:column;gap:.85rem}
.mf{padding:.9rem 1.2rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.mb .fld{color:var(--text)}
.mb .fld input,.mb .fld select,.mb .fld textarea{background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:.6rem .7rem;font-weight:600}
.mb .fld textarea{min-height:90px;resize:vertical}
.mb .fld input:focus,.mb .fld select:focus,.mb .fld textarea:focus{border-color:var(--accent);outline:none}
.mb .err{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:700}
.chk input{width:1.1rem;height:1.1rem}
.optrow{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:center}
.optrow .sw{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.optrow .sw svg{width:18px;height:18px;fill:#fff}
.optrow label.k{display:flex;align-items:center;gap:.3rem;font-weight:800;font-size:.85rem;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1f1637;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#a5122a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="stu">
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" class="hide" accept=".xlsx,.xls,.csv">
<input type="file" id="fileJson" class="hide" accept=".json,application/json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

/* ================= utilitas ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var now=function(){return Date.now()};
var norm=function(k){return String(k).toLowerCase().replace(/[^a-z0-9]/g,'')};
var num=function(n){return String(n).replace('.',',')};
var fdate=function(t){return t?new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-'};
var fdur=function(ms){var s=Math.max(0,Math.round(ms/1000));var m=Math.floor(s/60);return m+' mnt '+String(s%60).padStart(2,'0')+' dtk'};
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),d=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(d).padStart(2,'0')}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var SHAPES=[
 '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 30 28H2z"/></svg>',
 '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 30 16 16 30 2 16z"/></svg>',
 '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/></svg>',
 '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="2"/></svg>'];
var TILE=['t-red','t-blue','t-yellow','t-green'];
var COL=['var(--red)','var(--blue)','var(--yellow)','var(--green)'];
var LET=['A','B','C','D'];

var toastT;
function toast(m,type){var t=$('#toast');t.textContent=m;t.className='show'+(type==='err'?' err':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},3200)}

/* ================= penyimpanan (browser) ================= */
var KEY='cbt_app_v1';
function seed(){
  var ex=uid();
  var qs=[['12 × 8 = ...',['86','96','98','108'],1],['Hasil dari 3/4 + 1/4 adalah ...',['1/2','1','3/4','2'],1],
    ['Bilangan prima di antara pilihan berikut adalah ...',['21','27','29','33'],2],['Keliling persegi dengan sisi 7 cm adalah ... cm',['14','21','28','49'],2],
    ['15% dari 200 adalah ...',['15','20','30','45'],2]];
  return {
    settings:{school:'SMP Contoh Nusantara',adminUser:'admin',adminPass:'admin123',demo:true,sheetUrl:'',autoSync:false,lastSync:0},

function grade(r){
  var got=0,tot=0,c=0,w=0,b=0;
  r.qOrder.forEach(function(id){var q=byId(DB.questions,id);if(!q)return;var p=+q.points||1;tot+=p;var a=r.answers[id];
    if(a==null)b++;else if(a===q.answer){c++;got+=p}else w++});

async function saveFile(name,data){
  var dl=await getDL();
  if(dl){
    try{await dl.save({filename:name,data:data});toast('File siap disimpan: '+name)}
    catch(e){if(e&&e.code==='declined')return;toast('Gagal mengunduh: '+((e&&e.message)||'tidak diketahui'),'err')}
  }else{
    try{var b=data instanceof Blob?data:new Blob([data]);var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Mengunduh '+name)}
    catch(e){toast('Unduhan tidak didukung di tampilan ini','err')}
  }
}
function exportBook(name,sheets){
  if(window.XLSX){
    var wb=XLSX.utils.book_new();
    sheets.forEach(function(s){
      var ws=XLSX.utils.aoa_to_sheet(s.rows);
      var w=[];s.rows.forEach(function(r){r.forEach(function(c,i){w[i]=Math.min(60,Math.max(w[i]||8,String(c==null?'':c).length+2))})});
      ws['!cols']=w.map(function(x){return {wch:x}});
      XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31));
    });
    return saveFile(name+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  }
  var safe=function(c){c=String(c==null?'':c);if(/^[=+\-@]/.test(c))c="'"+c;return '"'+c.replace(/"/g,'""')+'"'};
  return saveFile(name+'.csv','\ufeff'+sheets[0].rows.map(function(r){return r.map(safe).join(',')}).join('\r\n'));
}
function readSheet(f){
  return new Promise(function(res,rej){
    if(!window.XLSX)return rej(new Error('pustaka Excel belum termuat, periksa koneksi internet'));
    var fr=new FileReader();fr.onerror=function(){rej(new Error('berkas tidak terbaca'))};
    fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}))}catch(e){rej(e)}};
    fr.readAsArrayBuffer(f);
  });
}

  for(var i=0;i<names.length;i++){var v=m[names[i]];if(v!==undefined&&String(v).trim()!=='')return String(v).trim()}return ''}

var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function curRes(){return byId(DB.results,S.resId)}
function tick(){
  var r=curRes();if(!r||r.status!=='ongoing'){stopTimer();return}
  var left=r.endsAt-now(),el=$('#tm');
  if(el){el.textContent=fmt(left);el.parentElement.classList.toggle('low',left<60000)}
  if(left<=0){finishExam(true)}
}
function startExam(exId,token){
  var s=student(),ex=byId(DB.exams,exId);
  if(!ex||!ex.active)return toast('Ujian tidak aktif','err');
  if(doneRes(s.id,ex.id))return toast('Kamu sudah mengerjakan ujian ini','err');
  if(String(token).trim().toLowerCase()!==String(ex.token).trim().toLowerCase())return false;
  var qs=DB.questions.filter(function(q){return q.examId===ex.id});
  if(!qs.length){toast('Ujian ini belum memiliki soal','err');return true}
  var ids=qs.map(function(q){return q.id});if(ex.shuffleQ)shuffle(ids);
  var opt={};qs.forEach(function(q){var o=[0,1,2,3].filter(function(i){return String(q.options[i]||'').trim()});if(ex.shuffleOpt)shuffle(o);opt[q.id]=o});
  var r={id:uid(),studentId:s.id,examId:ex.id,status:'ongoing',qOrder:ids,optOrder:opt,answers:{},flags:{},startedAt:now(),endsAt:now()+ex.duration*60000,switches:0};
  DB.results.push(r);save();S.resId=r.id;S.qi=0;S.screen='exam';closeModal();render();return true;
}
function finishExam(auto){
  var r=curRes();if(!r||r.status==='done')return;
  var g=grade(r);r.correct=g.correct;r.wrong=g.wrong;r.blank=g.blank;r.score=g.score;r.status='done';r.finishedAt=Math.min(now(),r.endsAt);
  save();stopTimer();closeModal();S.screen='result';render();

  var done=DB.results.filter(function(r){return r.status==='done'}),on=DB.results.filter(function(r){return r.status==='ongoing'});
  var recent=done.slice().sort(function(a,b){return b.finishedAt-a.finishedAt}).slice(0,8);
  var rows=recent.map(function(r){var s=byId(DB.students,r.studentId),e=byId(DB.exams,r.examId);
    return '<tr><td>'+esc(s?s.name:'(dihapus)')+'</td><td>'+esc(e?e.name:'(dihapus)')+'</td><td class="num"><b>'+num(r.score)+'</b></td><td>'+fdate(r.finishedAt)+'</td></tr>'}).join('');
  var onRows=on.map(function(r){var s=byId(DB.students,r.studentId),e=byId(DB.exams,r.examId);
    return '<tr><td>'+esc(s?s.name:'(dihapus)')+'</td><td>'+esc(e?e.name:'')+'</td><td>'+Object.keys(r.answers).length+'/'+r.qOrder.length+'</td></tr>'}).join('');

/* ---------- laporan ---------- */
function reportData(exId){
  var ex=byId(DB.exams,exId);if(!ex)return null;
  var results=DB.results.filter(function(r){return r.examId===exId});
  var elig=DB.students.filter(function(s){return matchKelas(ex,s)});
  var rows=elig.map(function(s){var r=results.find(function(x){return x.studentId===s.id});return {s:s,r:r}});
  results.forEach(function(r){if(!elig.some(function(s){return s.id===r.studentId})){var s=byId(DB.students,r.studentId);if(s)rows.push({s:s,r:r})}});
  var done=results.filter(function(r){return r.status==='done'});
  var sc=done.map(function(r){return r.score});
  var st={n:done.length,avg:sc.length?Math.round(sc.reduce(function(a,b){return a+b},0)/sc.length*10)/10:0,max:sc.length?Math.max.apply(null,sc):0,min:sc.length?Math.min.apply(null,sc):0,pass:done.filter(function(r){return r.score>=ex.kkm}).length};
  var items=DB.questions.filter(function(q){return q.examId===exId}).map(function(q){
    var t=0,c=0;done.forEach(function(r){if(r.qOrder.indexOf(q.id)>-1){t++;if(r.answers[q.id]===q.answer)c++}});
    return {q:q,t:t,c:c,p:t?Math.round(c/t*100):0};
  });
  return {ex:ex,rows:rows,st:st,items:items};
}
function pgLaporan(){
  if(!DB.exams.length)return head('Laporan Hasil')+'<div class="panel empty">Belum ada ujian.</div>';
  var d=reportData(S.adm.examId);
  var body=d.rows.map(function(x,i){
    var r=x.r,stat=!r?'<span class="tag">Belum mengerjakan</span>':r.status==='ongoing'?'<span class="tag warn">Sedang mengerjakan</span>':'<span class="tag ok">Selesai</span>';
    var done=r&&r.status==='done';
    return '<tr><td>'+(i+1)+'</td><td>'+esc(x.s.nis)+'</td><td>'+esc(x.s.name)+'</td><td>'+esc(x.s.kelas)+'</td><td>'+stat+'</td>'+
    '<td class="num">'+(done?'<b>'+num(r.score)+'</b>':'-')+'</td><td class="num">'+(done?r.correct:'-')+'</td><td class="num">'+(done?r.wrong:'-')+'</td><td class="num">'+(done?r.blank:'-')+'</td>'+
    '<td>'+(done?fdur(r.finishedAt-r.startedAt):'-')+'</td><td>'+(done?'<span class="tag '+(r.score>=d.ex.kkm?'ok':'bad')+'">'+(r.score>=d.ex.kkm?'Tuntas':'Belum tuntas')+'</span>':'-')+'</td>'+
    '<td>'+(r?'<div class="row">'+(done?'<button class="ab sec sm" data-act="detail" data-id="'+r.id+'">Detail</button>':'')+'<button class="ab dng sm" data-act="resetR" data-id="'+r.id+'">Reset</button></div>':'')+'</td></tr>'}).join('');
  var items=d.items.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td style="max-width:420px;overflow-wrap:anywhere">'+esc(x.q.text.slice(0,140))+(x.q.text.length>140?'…':'')+'</td><td class="num">'+x.c+'/'+x.t+'</td><td><div class="bargrp"><div class="bg"><i style="width:'+x.p+'%"></i></div><b>'+x.p+'%</b></div></td></tr>'}).join('');
  return head('Laporan Hasil','Rekap nilai dan analisis butir soal per ujian.','<button class="ab" data-act="expR">Ekspor laporan (Excel)</button>')+
  '<div class="bar">'+examSelect()+'</div>'+
  '<div class="stats"><div class="stat c2"><b>'+d.st.n+'</b><span>Selesai mengerjakan</span></div><div class="stat c3"><b>'+num(d.st.avg)+'</b><span>Rata-rata</span></div><div class="stat c4"><b>'+num(d.st.max)+'</b><span>Tertinggi</span></div><div class="stat c1"><b>'+num(d.st.min)+'</b><span>Terendah</span></div><div class="stat c5"><b>'+(d.st.n?Math.round(d.st.pass/d.st.n*100):0)+'%</b><span>Tuntas (KKM '+d.ex.kkm+')</span></div></div>'+
  (body?'<div class="tw"><table><thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Status</th><th class="num">Nilai</th><th class="num">Benar</th><th class="num">Salah</th><th class="num">Kosong</th><th>Durasi</th><th>Ket.</th><th>Aksi</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<div class="panel empty">Belum ada peserta untuk ujian ini.</div>')+
  '<h3 style="margin:1.4rem 0 .5rem">Analisis butir soal</h3>'+(items?'<div class="tw"><table><thead><tr><th>No</th><th>Soal</th><th class="num">Benar</th><th>Tingkat benar</th></tr></thead><tbody>'+items+'</tbody></table></div>':'<div class="panel empty">Belum ada soal.</div>')+
  '<p class="note">“Reset” menghapus hasil siswa sehingga ia bisa mengerjakan ulang.</p>';
}

  /* siswa (peserta) */
  start:function(t){var id=t.dataset.id;
    modal('Masukkan token ujian','<form id="fT" data-form="token" data-ex="'+id+'"><label class="fld"><span>Token dari pengawas</span><input name="token" autocomplete="off" autocapitalize="characters" required></label><p class="err" id="ferr" role="alert"></p></form>','<button class="ab sec" data-act="close">Batal</button><button class="ab" type="submit" form="fT">Mulai ujian</button>')},
  resume:function(){var r=ongoing(S.uid);if(r){S.resId=r.id;S.screen='exam';render()}},
  pick:function(t){var r=curRes(),q=byId(DB.questions,r.qOrder[S.qi]);r.answers[q.id]=+t.dataset.oi;save();vExam($('#app'))},
  prev:function(){S.qi--;render()},
  next:function(){S.qi++;render()},
  goto:function(t){S.qi=+t.dataset.k;render()},
  flag:function(){var r=curRes(),id=r.qOrder[S.qi];r.flags[id]=!r.flags[id];if(!r.flags[id])delete r.flags[id];save();render()},
  finish:function(){var r=curRes(),blank=r.qOrder.filter(function(id){return r.answers[id]==null}).length,fl=Object.keys(r.flags).length;
    ask('Kirim jawaban sekarang?'+(blank?'<br><b>'+blank+' soal belum dijawab.</b>':'')+(fl?'<br>'+fl+' soal masih ditandai ragu-ragu.':'')+'<br>Setelah dikirim, jawaban tidak bisa diubah.','Ya, kirim',function(){finishExam(false)})},

  /* admin: siswa */
  addS:function(){formSiswa()},
  editS:function(t){formSiswa(byId(DB.students,t.dataset.id))},
  delS:function(t){var s=byId(DB.students,t.dataset.id);ask('Hapus siswa <b>'+esc(s.name)+'</b>? Hasil ujiannya ikut terhapus.','Hapus',function(){DB.students=DB.students.filter(function(x){return x.id!==s.id});DB.results=DB.results.filter(function(r){return r.studentId!==s.id});save();toast('Siswa dihapus');renderAdminPage()},true)},
  selrow:function(t){S.adm.sel[t.dataset.id]=t.checked;refreshList()},
  selall:function(t){filteredStudents().forEach(function(s){S.adm.sel[s.id]=t.checked});refreshList()},
  delSel:function(){var ids=Object.keys(S.adm.sel).filter(function(k){return S.adm.sel[k]});
    ask('Hapus <b>'+ids.length+'</b> siswa terpilih beserta hasil ujiannya?','Hapus',function(){DB.students=DB.students.filter(function(s){return ids.indexOf(s.id)<0});DB.results=DB.results.filter(function(r){return ids.indexOf(r.studentId)<0});S.adm.sel={};save();toast('Siswa terpilih dihapus');renderAdminPage()},true)},
  impS:function(){chooseImport('siswa')},
  expS:function(){var rows=[['NIS','Nama','Kelas','Password']].concat(filteredStudents().map(function(s){return [s.nis,s.name,s.kelas,s.password]}));exportBook('data-siswa-'+today(),[{name:'Siswa',rows:rows}])},
  tplS:function(){exportBook('template-siswa',[{name:'Siswa',rows:templateSiswa()}])},

  /* admin: ujian */
  addE:function(){formUjian()},
  editE:function(t){formUjian(byId(DB.exams,t.dataset.id))},
  delE:function(t){var e=byId(DB.exams,t.dataset.id);ask('Hapus ujian <b>'+esc(e.name)+'</b> beserta seluruh soal dan hasilnya?','Hapus',function(){DB.exams=DB.exams.filter(function(x){return x.id!==e.id});DB.questions=DB.questions.filter(function(q){return q.examId!==e.id});DB.results=DB.results.filter(function(r){return r.examId!==e.id});save();toast('Ujian dihapus');renderAdminPage()},true)},
  toggleE:function(t){var e=byId(DB.exams,t.dataset.id);e.active=!e.active;save();renderAdminPage()},
  soalE:function(t){S.adm.examId=t.dataset.id;S.adm.page='soal';renderAdminPage()},
  genToken:function(){var i=$('#fE input[name=token]');if(i)i.value=genToken()},

  /* admin: soal */
  addQ:function(){if(!S.adm.examId)return toast('Pilih ujian terlebih dahulu','err');formSoal()},
  editQ:function(t){formSoal(byId(DB.questions,t.dataset.id))},
  delQ:function(t){ask('Hapus soal ini?','Hapus',function(){DB.questions=DB.questions.filter(function(q){return q.id!==t.dataset.id});save();toast('Soal dihapus');renderAdminPage()},true)},
  impQ:function(){chooseImport('soal')},
  expQ:function(){var ex=byId(DB.exams,S.adm.examId);if(!ex)return;
    var rows=[['Pertanyaan','A','B','C','D','Jawaban','Poin']].concat(DB.questions.filter(function(q){return q.examId===ex.id}).map(function(q){return [q.text,q.options[0]||'',q.options[1]||'',q.options[2]||'',q.options[3]||'',LET[q.answer],q.points||1]}));
    exportBook('soal-'+ex.name.replace(/[^\w]+/g,'-').slice(0,40)+'-'+today(),[{name:'Soal',rows:rows}])},
  tplQ:function(){exportBook('template-soal',[{name:'Soal',rows:[['Pertanyaan','A','B','C','D','Jawaban','Poin'],['Contoh: 2 + 3 = ...','4','5','6','7','B',1]]}])},

  /* admin: laporan */
  detail:function(t){showDetail(t.dataset.id)},
  resetR:function(t){var r=byId(DB.results,t.dataset.id),s=byId(DB.students,r.studentId);ask('Reset hasil <b>'+esc(s?s.name:'siswa')+'</b>? Siswa dapat mengerjakan ujian ini dari awal.','Reset',function(){DB.results=DB.results.filter(function(x){return x.id!==r.id});save();toast('Hasil direset');renderAdminPage()},true)},
  expR:function(){var d=reportData(S.adm.examId);if(!d)return;
    var rows=[['No','NIS','Nama','Kelas','Status','Nilai','Benar','Salah','Kosong','Durasi (menit)','Keterangan']].concat(d.rows.map(function(x,i){var r=x.r,done=r&&r.status==='done';
      return [i+1,x.s.nis,x.s.name,x.s.kelas,!r?'Belum mengerjakan':done?'Selesai':'Sedang mengerjakan',done?r.score:'',done?r.correct:'',done?r.wrong:'',done?r.blank:'',done?Math.round((r.finishedAt-r.startedAt)/600)/100:'',done?(r.score>=d.ex.kkm?'Tuntas':'Belum tuntas'):'']}));
    rows.push([],['Peserta selesai',d.st.n],['Rata-rata',d.st.avg],['Tertinggi',d.st.max],['Terendah',d.st.min],['KKM',d.ex.kkm],['Tuntas',d.st.pass]);
    var an=[['No','Soal','Jumlah benar','Jumlah peserta','Persen benar']].concat(d.items.map(function(x,i){return [i+1,x.q.text,x.c,x.t,x.p+'%']}));
    exportBook('laporan-'+d.ex.name.replace(/[^\w]+/g,'-').slice(0,40)+'-'+today(),[{name:'Rekap nilai',rows:rows},{name:'Analisis soal',rows:an}])},

  /* admin: pengaturan */
  backup:function(){saveFile('cadangan-ujian-'+today()+'.json',JSON.stringify(DB,null,2))},
  restore:function(){$('#fileJson').click()},
  clearDemo:function(){ask('Hapus siswa, ujian, dan soal contoh? Data yang Anda buat sendiri tidak ikut terhapus.','Hapus data contoh',function(){
      var exIds=DB.exams.filter(function(e){return e.token==='MTK123'&&/contoh/i.test(e.name)}).map(function(e){return e.id});
      var stIds=DB.students.filter(function(s){return ['1001','1002','1003'].indexOf(s.nis)>-1}).map(function(s){return s.id});
      DB.exams=DB.exams.filter(function(e){return exIds.indexOf(e.id)<0});DB.questions=DB.questions.filter(function(q){return exIds.indexOf(q.examId)<0});
      DB.students=DB.students.filter(function(s){return stIds.indexOf(s.id)<0});DB.results=DB.results.filter(function(r){return exIds.indexOf(r.examId)<0&&stIds.indexOf(r.studentId)<0});
      DB.settings.demo=false;save();toast('Data contoh dihapus');renderAdminPage()})},
  clearResults:function(){ask('Hapus <b>semua</b> hasil ujian? Siswa bisa mengerjakan ulang dari awal.','Hapus hasil',function(){DB.results=[];save();toast('Semua hasil dihapus');renderAdminPage()},true)},
  syncPush:function(){syncPush(false)},
  syncPull:function(){syncPull()},
  resetAll:function(){ask('Reset seluruh aplikasi? Semua siswa, ujian, soal, dan hasil akan dihapus, akun admin kembali ke bawaan.','Reset semua',function(){DB=seed();save();S.screen='login';closeModal();render();toast('Aplikasi direset ke data contoh')},true)}
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var f=ACT[t.dataset.act];if(!f)return;
  if(t.type==='checkbox'){f(t,e);return}
  f(t,e);
});

/* ================= form ================= */
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var fd=new FormData(f),g=function(k){return String(fd.get(k)==null?'':fd.get(k)).trim()};
  var ferr=function(m){var x=$('#ferr');if(x)x.textContent=m};
  switch(f.dataset.form){
    case 'login':{
      var nis=g('nis').toLowerCase(),s=DB.students.find(function(x){return x.nis.toLowerCase()===nis});
      if(!s||s.password!==String(fd.get('pw'))){S.err='NIS atau kata sandi salah.';render();return}
      S.err='';S.uid=s.id;var r=ongoing(s.id);if(r){S.resId=r.id;S.qi=0;S.screen='exam'}else S.screen='home';render();break}
    case 'adminlogin':{
      if(g('u')===DB.settings.adminUser&&String(fd.get('p'))===DB.settings.adminPass){S.err='';S.screen='admin';S.adm.page='dashboard';render()}
      else{S.err='Nama pengguna atau kata sandi admin salah.';render()}break}
    case 'token':{
      var res=startExam(f.dataset.ex,g('token'));if(res===false)ferr('Token salah. Tanyakan token yang benar kepada pengawas.');break}
    case 'siswa':{
      var id=g('id'),nis2=g('nis'),name=g('name');
      if(!nis2||!name)return ferr('NIS dan nama wajib diisi.');
      if(DB.students.some(function(x){return x.id!==id&&x.nis.toLowerCase()===nis2.toLowerCase()}))return ferr('NIS sudah dipakai siswa lain.');
      var pw=String(fd.get('password')||'').trim()||nis2;
      if(id){var s2=byId(DB.students,id);s2.nis=nis2;s2.name=name;s2.kelas=g('kelas');s2.password=pw}
      else DB.students.push({id:uid(),nis:nis2,name:name,kelas:g('kelas'),password:pw});
      save();closeModal();toast('Data siswa disimpan');renderAdminPage();break}
    case 'ujian':{
      var eid=g('id'),dur=parseInt(g('duration'),10),kkm=parseFloat(g('kkm'));
      if(!g('name')||!g('token'))return ferr('Nama ujian dan token wajib diisi.');
      if(!(dur>0))return ferr('Durasi harus lebih dari 0 menit.');
      var o={name:g('name'),mapel:g('mapel'),kelas:g('kelas'),duration:dur,kkm:isNaN(kkm)?70:kkm,token:g('token'),active:!!fd.get('active'),shuffleQ:!!fd.get('shuffleQ'),shuffleOpt:!!fd.get('shuffleOpt'),showResult:!!fd.get('showResult')};
      if(eid)Object.assign(byId(DB.exams,eid),o);else{o.id=uid();DB.exams.push(o);S.adm.examId=o.id}
      save();closeModal();toast('Ujian disimpan');renderAdminPage();break}
    case 'soal':{
      var qid=g('id'),opts=[0,1,2,3].map(function(i){return g('o'+i)}),ans=parseInt(g('ans'),10);
      if(!g('text'))return ferr('Pertanyaan wajib diisi.');
      if(opts.filter(Boolean).length<2)return ferr('Isi minimal dua pilihan jawaban.');
      if(!opts[ans])return ferr('Kunci jawaban harus menunjuk ke pilihan yang terisi.');
      var q={text:String(fd.get('text')).trim(),options:opts,answer:ans,points:parseFloat(g('points'))||1};
      if(qid)Object.assign(byId(DB.questions,qid),q);else{q.id=uid();q.examId=S.adm.examId;DB.questions.push(q)}
      save();closeModal();toast('Soal disimpan');renderAdminPage();break}
    case 'sheet':{DB.settings.sheetUrl=g('sheetUrl');DB.settings.autoSync=!!fd.get('autoSync');save();toast('Pengaturan spreadsheet disimpan');renderAdminPage();break}
    case 'school':{DB.settings.school=g('school');save();toast('Nama sekolah disimpan');renderAdminPage();document.querySelector('.side .logo small').textContent=DB.settings.school;break}
    case 'admin':{
      if(String(fd.get('p')).length<6)return toast('Kata sandi minimal 6 karakter','err');
      DB.settings.adminUser=g('u');DB.settings.adminPass=String(fd.get('p'));save();f.reset();toast('Akun admin diperbarui. Gunakan saat login berikutnya.');break}
  }
});

/* ================= input / change ================= */
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.search){S.adm[t.dataset.search]=t.value;refreshList()}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.filter){S.adm[t.dataset.filter]=t.value;refreshList()}
  else if(t.dataset&&t.dataset.exam!==undefined){S.adm.examId=t.value;renderAdminPage()}
  else if(t.id==='fileIn'){
    var f=t.files[0],kind=t.dataset.kind;t.value='';if(!f||!IMPORTS[kind])return;
    readSheet(f).then(function(rows){if(!rows.length)return toast('Berkas kosong atau format tidak sesuai template','err');IMPORTS[kind](rows)}).catch(function(err){toast('Gagal membaca berkas: '+err.message,'err')});
  }else if(t.id==='fileJson'){
    var j=t.files[0];t.value='';if(!j)return;
    var fr=new FileReader();fr.onload=function(){
      try{var d=JSON.parse(fr.result);if(!(d&&d.settings&&Array.isArray(d.students)&&Array.isArray(d.exams)&&Array.isArray(d.questions)&&Array.isArray(d.results)))throw new Error('format cadangan tidak dikenali');
        ask('Pulihkan cadangan? Data saat ini akan diganti seluruhnya.','Pulihkan',function(){DB=d;save();toast('Data dipulihkan');renderAdminPage()},true)}
      catch(err){toast('Gagal memulihkan: '+err.message,'err')}};
    fr.readAsText(j);
  }
});

/* peringatan pindah tab saat ujian */
document.addEventListener('visibilitychange',function(){
  if(S.screen!=='exam')return;var r=curRes();if(!r||r.status!=='ongoing')return;
  if(document.hidden){r.switches=(r.switches||0)+1;save()}
  else toast('Jangan meninggalkan halaman ujian. Perpindahan tab tercatat.','err');
});

loadSess();render();
})();
</script>
