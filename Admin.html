
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIUJIAN TKA PRO — Admin/Guru</title>
<style>
:root{--p:#1f4e78;--bg:#f4f7fb;--card:#fff;--txt:#172033;--muted:#6b7280;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}
.top{background:var(--p);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:700}
.wrap{max-width:1280px;margin:auto;padding:20px}.login{max-width:420px;margin:10vh auto}.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 3px 18px #0000000c;margin-bottom:16px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d5dbe5;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#e8edf4}.primary{background:var(--p);color:#fff}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 18px #0000000c}.stat b{font-size:26px;display:block}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:15px 0}.tab{padding:10px 13px;border-radius:9px;cursor:pointer;background:#e7edf5}.tab.active{background:var(--p);color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.table th{background:#f8fafc}.muted{color:var(--muted)}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px}.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#e5e7eb}.ok{background:#dcfce7;color:#166534}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{display:flex;align-items:center;gap:8px;margin:8px 0}.bar span{display:block;height:18px;background:#6b7280;border-radius:5px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modal .card{width:min(650px,100%);max-height:90vh;overflow:auto}@media(max-width:800px){.grid,.charts{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.charts{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div id="app"></div>
<script>
let SID=sessionStorage.getItem('siujian_sid')||'', ME=JSON.parse(sessionStorage.getItem('siujian_me')||'null'), TAB='dashboard', DATA={};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function call(fn,args=[]){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args))}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function loginView(){app.innerHTML=`<div class="login card"><h2>SIUJIAN TKA PRO</h2><p class="muted">Login Admin / Guru</p><div class="field"><label>Username</label><input id="u" value="admin"></div><div class="field"><label>Password</label><input id="p" type="password" value="admin123"></div><button class="btn primary" style="width:100%" onclick="login()">Masuk</button><p class="muted" style="font-size:12px">Akun awal: admin/admin123 dan guru/guru123. Segera ganti password setelah instalasi.</p></div>`}
async function login(){try{const r=await call('login',[$('u').value,$('p').value]);SID=r.token;ME=r.user;sessionStorage.setItem('siujian_sid',SID);sessionStorage.setItem('siujian_me',JSON.stringify(ME));render()}catch(e){toast(e.message||e)}}
async function logout(){await call('logout',[SID]).catch(()=>{});sessionStorage.clear();SID='';ME=null;render()}
async function api(fn,args=[]){try{return await call(fn,[SID,...args])}catch(e){if((e.message||'').includes('Sesi')){sessionStorage.clear();SID='';ME=null;render()}throw e}}
async function render(){if(!SID||!ME)return loginView(); DATA.dash=await api('dashboard'); app.innerHTML=`<div class="top"><div class="brand">SIUJIAN TKA PRO</div><div>${esc(ME.nama)} · ${esc(ME.role)} <button class="btn" onclick="logout()">Keluar</button></div></div><div class="wrap"><div class="tabs">${['dashboard','siswa','kelas','ujian','jadwal','ranking','statistik','laporan','pengguna'].filter(x=>ME.role==='admin'||x!=='pengguna').map(x=>`<div class="tab ${TAB===x?'active':''}" onclick="TAB='${x}';render()"> ${x[0].toUpperCase()+x.slice(1)}</div>`).join('')}</div><div id="content"></div></div>`; draw()}
async function draw(){const c=$('content'); if(TAB==='dashboard')c.innerHTML=dashboard(); else if(TAB==='ranking')await ranking(); else if(TAB==='statistik')await statistik(); else if(TAB==='laporan')c.innerHTML=reportView(); else if(TAB==='siswa')await crud('students','Siswa'); else if(TAB==='kelas')await crud('classes','Kelas'); else if(TAB==='ujian')await crud('exams','Ujian'); else if(TAB==='jadwal')await crud('schedules','Jadwal'); else if(TAB==='pengguna')await crud('users','Pengguna');}
function dashboard(){let d=DATA.dash;return `<div class="grid"><div class="stat"><b>${d.counts.students}</b>Siswa</div><div class="stat"><b>${d.counts.classes}</b>Kelas</div><div class="stat"><b>${d.counts.exams}</b>Ujian</div><div class="stat"><b>${d.counts.results}</b>Hasil</div><div class="stat"><b>${d.scores.average}</b>Rata-rata</div><div class="stat"><b>${d.scores.persenTuntas}%</b>Tuntas</div></div><div class="card"><h3>Hasil terbaru</h3><table class="table"><tr><th>Nama</th><th>Kelas</th><th>Ujian</th><th>Nilai</th></tr>${d.recent.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(r.ujianJudul)}</td><td><b>${r.nilai}</b></td></tr>`).join('')||'<tr><td colspan=4>Belum ada data</td></tr>'}</table></div>`}
async function crud(mod,title){const rows=await api('proList',[mod,{}]); let cols=mod==='students'?['nis','nisn','nama','jk','kelasId','aktif']:mod==='classes'?['kode','nama','tingkat','jurusan','waliKelas','tahunAjaran','aktif']:mod==='exams'?['kode','judul','mapel','tingkat','durasiMenit','kkm','status']:mod==='schedules'?['ujianId','kelasId','mulai','selesai','status','tokenId']:['username','nama','email','role','aktif']; $('content').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="btn primary" onclick="edit('${mod}')">+ Tambah</button></div><div style="overflow:auto"><table class="table"><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Aksi</th></tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}<td><button class="btn" onclick='edit(${JSON.stringify(mod)},${JSON.stringify(r)})'>Edit</button> ${ME.role==='admin'?`<button class="btn danger" onclick="del('${mod}','${r.id}')">Hapus</button>`:''}${mod==='schedules'?` <button class="btn primary" onclick="token('${r.id}')">Token</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function edit(mod,r={}){const fields=mod==='students'?['nis','nisn','nama','jk','kelasId','email','noHp','aktif']:mod==='classes'?['kode','nama','tingkat','jurusan','waliKelas','tahunAjaran','aktif']:mod==='exams'?['kode','judul','mapel','tingkat','durasiMenit','kkm','deskripsi','status']:mod==='schedules'?['ujianId','kelasId','mulai','selesai','status','maksPercobaan']:['username','nama','email','role','aktif','kelasScope','password']; $('app').insertAdjacentHTML('beforeend',`<div class="modal"><div class="card"><h3>Form ${mod}</h3>${fields.map(f=>`<div class="field"><label>${f}</label><input id="f_${f}" value="${esc(r[f]??'')}"></div>`).join('')}<div class="row"><button class="btn" onclick="this.closest('.modal').remove()">Batal</button><button class="btn primary" onclick='saveForm(${JSON.stringify(mod)},${JSON.stringify(r.id||'')})'>Simpan</button></div></div></div>`)}
async function saveForm(mod,id){let fields=mod==='students'?['nis','nisn','nama','jk','kelasId','email','noHp','aktif']:mod==='classes'?['kode','nama','tingkat','jurusan','waliKelas','tahunAjaran','aktif']:mod==='exams'?['kode','judul','mapel','tingkat','durasiMenit','kkm','deskripsi','status']:mod==='schedules'?['ujianId','kelasId','mulai','selesai','status','maksPercobaan']:['username','nama','email','role','aktif','kelasScope','password'];let o={id:id||undefined};fields.forEach(f=>o[f]=$('f_'+f).value);try{await api('proSave',[mod,o]);toast('Tersimpan');TAB=mod==='students'?'siswa':mod==='classes'?'kelas':mod==='exams'?'ujian':mod==='schedules'?'jadwal':'pengguna';render()}catch(e){toast(e.message||e)}}
async function del(mod,id){if(!confirm('Hapus data ini?'))return;try{await api('proDelete',[mod,id]);render()}catch(e){toast(e.message||e)}}
async function token(id){try{const t=await api('generateTokenForSchedule',[id]);alert('TOKEN: '+t.token+'\\nBerlaku sampai: '+new Date(t.berlakuSampai).toLocaleString('id-ID'))}catch(e){toast(e.message||e)}}
async function ranking(){const rows=await api('ranking',[{}]);$('content').innerHTML=`<div class="card"><h2>Ranking Nilai</h2><table class="table"><tr><th>Peringkat</th><th>Nama</th><th>Kelas</th><th>Ujian</th><th>Nilai</th></tr>${rows.map(r=>`<tr><td>${r.peringkat}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(r.ujianJudul)}</td><td><b>${r.nilai}</b></td></tr>`).join('')}</table></div>`}
async function statistik(){const s=await api('statistics',[{}]);$('content').innerHTML=`<div class="grid"><div class="stat"><b>${s.jumlah}</b>Peserta</div><div class="stat"><b>${s.rataRata}</b>Rata-rata</div><div class="stat"><b>${s.median}</b>Median</div><div class="stat"><b>${s.tertinggi}</b>Tertinggi</div><div class="stat"><b>${s.terendah}</b>Terendah</div></div><div class="card"><h3>Distribusi Nilai</h3>${Object.entries(s.distribusi).map(([k,v])=>`<div class="bar"><label style="width:65px">${k}</label><span style="width:${Math.max(3,v*12)}px"></span><b>${v}</b></div>`).join('')}</div>`}
function reportView(){return `<div class="card"><h2>Laporan Nilai</h2><p class="muted">Unduh seluruh hasil saat ini. Filter per ujian/kelas dapat ditambahkan pada tahap berikutnya.</p><div class="row"><button class="btn primary" onclick="report('CSV')">Excel/CSV</button><button class="btn primary" onclick="report('XLSX')">Excel XLSX</button><button class="btn primary" onclick="report('PDF')">PDF</button></div></div>`}
async function report(kind){try{const fn=kind==='CSV'?'exportReportCSV':kind==='XLSX'?'exportReportXLSX':'exportReportPDF';const r=await api(fn,[{}]);const a=document.createElement('a');a.href='data:'+r.mime+';base64,'+r.base64;a.download=r.filename;a.click()}catch(e){toast(e.message||e)}}
render();
</script></body></html>
